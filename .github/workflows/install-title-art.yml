name: Install 野菜聖女 title artwork

on:
  push:
    branches: ["main"]
    paths:
      - "assets/title/title-art.avif.b64"

permissions:
  contents: write

jobs:
  install-title-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode optimized title artwork
        shell: bash
        run: |
          mkdir -p assets/title
          tr -d '\r\n\t ' < assets/title/title-art.avif.b64 | base64 --decode > assets/title/title-art.avif
          test "$(wc -c < assets/title/title-art.avif)" -eq 32891
          file assets/title/title-art.avif
      - name: Commit title artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/title/title-art.avif
          if ! git diff --cached --quiet; then
            git commit -m "assets: install optimized title illustration"
            git push
          fi
