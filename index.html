<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6b55" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="野菜聖女" />
  <title>野菜聖女</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="stylesheet" href="./assets/step10.css" />
  <link rel="stylesheet" href="./assets/step11.css" />
  <link rel="stylesheet" href="./assets/step13.css" />
  <link rel="stylesheet" href="./assets/step14.css" />
  <link rel="stylesheet" href="./assets/step16.css" />
  <link rel="stylesheet" href="./assets/bgm.css" />
  <link rel="stylesheet" href="./assets/title.css" />
</head>
<body class="is-at-title">
  <div class="app-shell">
    <header class="app-header">
      <p class="eyebrow">異世界菜園</p>
      <h1>野菜聖女</h1>
      <p id="screen-caption" class="screen-caption">畑</p>
      <div class="app-header-utility" role="group" aria-label="セーブと画面移動">
        <p id="manual-save-status" class="manual-save-status" role="status" aria-live="polite">自動保存 ON</p>
        <button id="manual-save-button" class="manual-save-button" type="button">今すぐセーブ</button>
        <button id="return-to-title" class="return-to-title" type="button">タイトルへ</button>
      </div>
      <div class="bgm-panel" role="group" aria-label="BGM設定">
        <button id="bgm-toggle" class="bgm-toggle" type="button" aria-pressed="false">♪ BGM ON</button>
        <label class="bgm-volume-label" for="bgm-volume">
          音量
          <input id="bgm-volume" class="bgm-volume" type="range" min="0" max="100" step="5" value="50" />
        </label>
      </div>
      <p id="bgm-status" class="bgm-status" role="status" aria-live="polite">BGMは停止中です。</p>
    </header>

    <main id="screen-root" class="screen-root" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="メイン画面">
      <button class="nav-button" type="button" data-screen="lab" aria-label="研究所へ移動">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>研究所</span>
      </button>
      <button class="nav-button" type="button" data-screen="field" aria-label="畑へ移動">
        <span class="nav-icon" aria-hidden="true">♧</span>
        <span>畑</span>
      </button>
      <button class="nav-button" type="button" data-screen="home" aria-label="自宅へ移動">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>自宅</span>
      </button>
    </nav>
  </div>

  <div id="name-setup-root" class="name-setup-root"></div>
  <div id="title-root" class="title-root">
    <div class="title-loading" role="status"><strong>野菜聖女</strong><span>読み込み中…</span></div>
  </div>

  <noscript>このアプリを遊ぶにはJavaScriptを有効にしてください。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
